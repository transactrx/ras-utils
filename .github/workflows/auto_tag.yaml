name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    name: 'Create Release Tag'
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true && (
        startsWith(github.event.pull_request.head.ref, 'major/') ||
        startsWith(github.event.pull_request.head.ref, 'minor/') ||
        startsWith(github.event.pull_request.head.ref, 'build/') ||
        startsWith(github.event.pull_request.head.ref, 'feature/')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version increment
        id: increment
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH" == major/* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == minor/* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == build/* ]] || [[ "$BRANCH" == feature/* ]]; then
            echo "type=build" >> $GITHUB_OUTPUT
          fi
          echo "Branch: $BRANCH -> Increment: $(cat $GITHUB_OUTPUT | grep type | cut -d= -f2)"

      - name: Get latest tag and calculate new version
        id: tag
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            MAJOR=$(echo $LATEST | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo $LATEST | cut -d. -f2)
            PATCH=$(echo $LATEST | cut -d. -f3)
          fi

          INCREMENT="${{ steps.increment.outputs.type }}"

          if [ "$INCREMENT" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$INCREMENT" = "build" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Latest: $LATEST -> New: $NEW_TAG ($INCREMENT)"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.tag.outputs.new_tag }} -m "Release ${{ steps.tag.outputs.new_tag }}"
          git push origin ${{ steps.tag.outputs.new_tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag.outputs.new_tag }} \
            --title "Release ${{ steps.tag.outputs.new_tag }}" \
            --notes "Auto-generated release from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
            --latest
