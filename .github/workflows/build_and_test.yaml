name: Build and Test
on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'feature/*'
  pull_request:
    branches: ['main']

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Build
        run: go build ./...

  test:
    name: 'Run Tests'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run Tests
        run: |
          echo "Running tests with coverage..."
          set -e
          if go test ./... -v -coverprofile=coverage.out -timeout=5m -parallel=4; then
            echo "All tests passed successfully"
            go tool cover -func=coverage.out | tail -1
          else
            echo "Tests failed"
            exit 1
          fi

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30